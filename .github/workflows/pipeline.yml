# Secretless file — safe in the public repo. CRON_SECRET is a GitHub
# Actions repository secret (Settings → Secrets and variables → Actions),
# never checked in; setup in docs/plans/p2.5-self-running.md Wave 3.
#
# PERMANENT scheduler (D54, $0 launch posture 2026-07-31): sub-daily Vercel
# crons need Pro, so this workflow IS the */15 heartbeat and is NOT deleted
# at launch; vercel.json's two daily crons stay as the fallback safety net.
# GitHub auto-disables scheduled workflows after 60 days of repo inactivity
# (any push resets the clock) — the daily Vercel sweep covers that gap.
#
# The curl targets stay on the permanent dorkhub-ten.vercel.app alias ON
# PURPOSE: these are Bearer-auth API routes with zero SEO/branding stake,
# and pinning them to the alias decouples the ingest/moderation loop from
# dorkhub.com's DNS/cert health.
name: pipeline

on:
  schedule:
    - cron: '4,19,34,49 * * * *' # offset minutes — GitHub delays top-of-hour jobs under load
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Safety first (P3-C D34 split): the AI/moderation worker gets its own
      # invocation and full window before ingest runs.
      - name: ping pipeline (enrich + screen)
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dorkhub-ten.vercel.app/api/cron/pipeline
      # Runs even if the AI step failed (`if: always()`) — a transient 500
      # on one worker must not silently pause the other; the job still
      # reports red if either step failed.
      - name: ping ingest (materialize + sync slice)
        if: always()
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dorkhub-ten.vercel.app/api/cron/ingest
