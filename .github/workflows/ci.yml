# The green gate, run by a machine: build + types + tests, then the reader's whole walk in Chromium.
# Nothing here deploys; Vercel does that from main (and skips a push that changes nothing deployed:
# scripts/skip-build.mjs).
#
# What runs when, so that nothing runs twice or for nothing:
# - A pull request: both jobs, on the branch merged with main. This is the gate before a merge.
# - A push to main: the tests always. The walk only for a direct push: a merged pull request was walked
#   already, as that same merge, so its push to main does not walk again.
# - Records alone (docs/, Markdown at the root): nothing. They change no behaviour.
# - By hand, from the Actions tab: both jobs, on any branch.
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
  e2e:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    # Pinned: the installed Playwright ships browsers for this release, not yet for the newest one.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium is about 170 MB to fetch: keep it between runs, keyed by the Playwright that needs it.
      - id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      # The walk gets one more try before it counts as a failure, and says so when it needed it: a
      # second try that passes is a flaky check to find, not a pass to forget.
      - run: npm run e2e || (echo "::warning title=The walk needed a second try::Its first run failed; read this job's log for the step." && npm run e2e)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: .e2e/
          retention-days: 7
