# The green gate, run by a machine: build + types + tests on every push and pull request, then the
# reader's whole walk in Chromium. Nothing here deploys; Vercel does that from main.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
  e2e:
    # Pinned: the installed Playwright ships browsers for this release, not yet for the newest one.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The walk gets one more try before it counts as a failure, and says so when it needed it: a
      # second try that passes is a flaky check to find, not a pass to forget.
      - run: npm run e2e || (echo "::warning title=The walk needed a second try::Its first run failed; read this job's log for the step." && npm run e2e)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: .e2e/
          retention-days: 7
